<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">🌿 Habit Tracker</a>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="card-title h4">Add a new habit</h2>
              <p class="text-muted">Keep it simple and build one good habit at a time.</p>

              <form id="habitForm">
                <div class="mb-3">
                  <label for="habitName" class="form-label">Habit name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="habitName"
                    placeholder="Example: Read 10 pages"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="habitCategory" class="form-label">Category</label>
                  <select class="form-select" id="habitCategory">
                    <option value="Health">Health</option>
                    <option value="Learning">Learning</option>
                    <option value="Productivity">Productivity</option>
                    <option value="Lifestyle">Lifestyle</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Save habit</button>
              </form>

              <div id="message" class="alert mt-3 d-none"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <h2 class="card-title h4 mb-0">Your habits</h2>
                <span class="badge bg-success" id="habitCount">0</span>
              </div>
              <div id="habitList" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
